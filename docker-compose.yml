version: "3.8"

services:
  # ==================== qBittorrentEE Pro ====================
  qbittorrentee:
    image: ghcr.io/qvq12138/qbittorrentee:latest
    # build: .   # uncomment if you want to build locally
    container_name: qbittorrentee
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUIPORT=8080
      - ENABLE_DOWNLOADS_PERM_FIX=true
      - ENABLE_TRACKER_UPDATE=true
      # Optional: set WebUI credentials
      # - WEB_USERNAME=admin
      # - WEB_PASSWORD=yourpassword
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v2/app/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== qbit_manage (optional sidecar) ====================
