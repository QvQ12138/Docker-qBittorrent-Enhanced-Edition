name: Manual Build Docker Image

on:
  push:
    paths:
      - "ReleaseTag"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional. Only runs when both secrets are present.
      - name: Login to Docker Hub (optional)
        id: dockerhub-login
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Version
        id: set-version
        run: |
          VERSION=$(cat ReleaseTag | head -n1 | tr -d '[:space:]')
          if [ -z "${VERSION}" ]; then
            echo "::error::ReleaseTag is empty"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ReleaseTag=${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/qvq12138/qbittorrentee:${{ steps.set-version.outputs.version }}
            ghcr.io/qvq12138/qbittorrentee:latest
            ${{ steps.dockerhub-login.outcome == 'success' && format('superng6/qbittorrentee:{0}', steps.set-version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outcome == 'success' && 'superng6/qbittorrentee:latest' || '' }}
