name: GHCR Build amd64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        id: v
        run: |
          VERSION=$(cat ReleaseTag | head -n1)
          if [ -z "${VERSION}" ]; then echo "::error::ReleaseTag empty"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qvq12138/qbittorrentee:${{ steps.v.outputs.version }}
