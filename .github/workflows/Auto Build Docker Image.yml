name: Auto Build Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional. Only runs when both secrets are present.
      - name: Login to Docker Hub (optional)
        id: dockerhub-login
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Version
        id: set-version
        run: |
          VERSION=$(cat ReleaseTag | head -n1 | tr -d '[:space:]')
          if [ -z "${VERSION}" ]; then
            echo "::error::ReleaseTag is empty"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ReleaseTag=${VERSION}"

      - name: Cache tag
        id: cache-tag
        uses: actions/cache@v4
        with:
          path: ./tag/
          key: ${{ runner.os }}-tag-v${{ steps.set-version.outputs.version }}

      - name: Prepare new tag marker
        id: get-release-tag
        if: steps.cache-tag.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./tag
          echo "${{ steps.set-version.outputs.version }}" > ./tag/tag-${{ steps.set-version.outputs.version }}
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        if: steps.get-release-tag.outputs.status == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/qvq12138/qbittorrentee:${{ steps.set-version.outputs.version }}
            ghcr.io/qvq12138/qbittorrentee:latest
            ${{ steps.dockerhub-login.outcome == 'success' && format('superng6/qbittorrentee:{0}', steps.set-version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outcome == 'success' && 'superng6/qbittorrentee:latest' || '' }}
          # Note: empty lines from the conditional tags are ignored by build-push-action
