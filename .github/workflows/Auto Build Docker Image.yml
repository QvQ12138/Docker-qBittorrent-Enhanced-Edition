name: Auto Build Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not set, skipping Docker Hub login/push"
          fi

      - name: Login to Docker Hub (optional)
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Version
        id: set-version
        run: |
          VERSION=$(cat ReleaseTag | head -n1 | tr -d '[:space:]')
          if [ -z "${VERSION}" ]; then
            echo "::error::ReleaseTag is empty"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ReleaseTag=${VERSION}"

      - name: Cache tag
        id: cache-tag
        uses: actions/cache@v4
        with:
          path: ./tag/
          key: ${{ runner.os }}-tag-v${{ steps.set-version.outputs.version }}

      - name: Prepare new tag marker
        id: get-release-tag
        if: steps.cache-tag.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./tag
          echo "${{ steps.set-version.outputs.version }}" > ./tag/tag-${{ steps.set-version.outputs.version }}
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Generate image tags
        id: tags
        if: steps.get-release-tag.outputs.status == 'success'
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          TAGS="ghcr.io/qvq12138/qbittorrentee:${VERSION}"
          TAGS="${TAGS}"$'
'"ghcr.io/qvq12138/qbittorrentee:latest"

          if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
            TAGS="${TAGS}"$'
'"superng6/qbittorrentee:${VERSION}"
            TAGS="${TAGS}"$'
'"superng6/qbittorrentee:latest"
          fi

          # multiline output
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Generated tags:"
          echo "$TAGS"

      - name: Build and push
        if: steps.get-release-tag.outputs.status == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
